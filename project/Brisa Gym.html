  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-weight: 500;\n  font-display: swap;\n  src: url(\"95a2a121-0eef-41d0-bba0-3e72a6049ba5\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ef2d0664-c735-4179-83de-be6fa02adb28\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8b947fc9-2b28-4d47-82bd-7a420e9aad83\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n  \n  <style>\n\n/* ─────────────────────────────────────────────────────────────────\n   BRISA GYM — Design System\n   Cores extraídas directamente da logo:\n     --taupe        #AF9C82   (fundo da logo)\n     --cream        #EFE9D5   (texto BRISA)\n     --maroon       #5F3B2C   (texto Gym + ponto)\n   Paleta expandida para o site — sempre quente, nunca fria.\n───────────────────────────────────────────────────────────────── */\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\n\n:root{\n  /* Logo exact */\n  --taupe:       #AF9C82;\n  --cream:       #EFE9D5;\n  --maroon:      #5F3B2C;\n\n  /* Expanded warm palette */\n  --taupe-light: #C8B49A;\n  --taupe-dark:  #8A7462;\n  --taupe-xdark: #5E4E40;\n  --cream-light: #FAF7F2;\n  --cream-mid:   #F3EDE1;\n  --cream-dark:  #E4D9C8;\n  --maroon-lt:   #7A4F3E;\n  --maroon-xlt:  #9A6A55;\n  --sand:        #D4C4AA;\n\n  /* Site semantics */\n  --bg-hero:     #AF9C82;\n  --bg-page:     #FAF7F2;   /* cream light — main background */\n  --bg-alt:      #F3EDE1;   /* slightly darker cream */\n  --bg-card:     #FFFFFF;\n  --text-h:      #2A1B10;   /* headings */\n  --text-b:      #4A3626;   /* body */\n  --text-m:      #7A6450;   /* muted */\n  --border:      rgba(95,59,44,0.12);\n}\n\nbody{\n  font-family:'Jost',sans-serif;\n  background:var(--bg-page);\n  color:var(--text-b);\n  overflow-x:hidden;\n}\n\n::-webkit-scrollbar{width:3px}\n::-webkit-scrollbar-track{background:var(--cream-mid)}\n::-webkit-scrollbar-thumb{background:var(--taupe)}\n\n/* ── Animations ────────────────────────────────────────────────── */\n@keyframes fadeUp  {from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}\n@keyframes fadeIn  {from{opacity:0}to{opacity:1}}\n@keyframes pulse   {0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}\n@keyframes scroll  {0%,100%{opacity:.4}50%{opacity:.9}}\n@keyframes chatIn  {from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}\n@keyframes blink   {0%,80%,100%{opacity:0}40%{opacity:1}}\n\n.reveal{opacity:0;transform:translateY(30px);transition:opacity .75s ease,transform .75s ease}\n.reveal.visible{opacity:1;transform:none}\n\n/* ── LOGO BLOCK ─────────────────────────────────────────────────── */\n.logo-block{\n  display:inline-flex;flex-direction:column;align-items:flex-start;\n  background:var(--taupe);\n  text-decoration:none;\n  padding:.6rem 1.2rem .46rem;\n}\n.lb-brisa{\n  font-family:'Jost',sans-serif;font-weight:100;\n  color:var(--cream);line-height:1;letter-spacing:.28em;\n}\n.lb-i{display:inline-block;position:relative}\n.lb-i::before{\n  content:'';position:absolute;border-radius:50%;\n  background:var(--maroon);left:50%;transform:translateX(-50%);\n}\n.lb-gym{\n  font-family:'Dancing Script',cursive;font-weight:400;\n  color:var(--maroon);line-height:1;align-self:flex-end;\n}\n\n/* Nav logo */\n#nav .lb-brisa{font-size:1.38rem}\n#nav .lb-i::before{width:4px;height:4px;top:-5px}\n#nav .lb-gym{font-size:.9rem;margin-top:-.05rem}\n\n/* Hero logo */\n.hero-logo .lb-brisa{font-size:3.8rem}\n.hero-logo .lb-i::before{width:8px;height:8px;top:-12px}\n.hero-logo .lb-gym{font-size:2.1rem;margin-top:-.3rem}\n\n/* Footer logo */\n.ft-logo .lb-brisa{font-size:1.18rem}\n.ft-logo .lb-i::before{width:3px;height:3px;top:-4px}\n.ft-logo .lb-gym{font-size:.76rem;margin-top:-.04rem}\n\n/* ── NAV ─────────────────────────────────────────────────────────── */\n#nav{\n  position:fixed;top:0;left:0;right:0;z-index:100;\n  padding:.9rem 3.5rem;\n  display:flex;justify-content:space-between;align-items:center;\n  transition:background .4s,backdrop-filter .4s,box-shadow .4s;\n}\n#nav:not(.scrolled){\n  background:linear-gradient(to bottom,rgba(175,156,130,.85),rgba(175,156,130,0));\n}\n#nav.scrolled{\n  background:rgba(175,156,130,.96);\n  backdrop-filter:blur(12px);\n  box-shadow:0 1px 0 rgba(95,59,44,.15);\n}\n.nav-links{display:flex;gap:2.4rem;list-style:none}\n.nav-links a{\n  font-size:.66rem;font-weight:300;letter-spacing:.22em;\n  text-transform:uppercase;color:var(--cream);\n  text-decoration:none;transition:color .3s;\n  text-shadow:0 1px 4px rgba(45,28,18,.3);\n}\n.nav-links a:hover{color:#fff}\n\n/* ── HERO ────────────────────────────────────────────────────────── */\n#hero{\n  min-height:100vh;\n  display:grid;grid-template-columns:1fr 1fr;\n  align-items:center;\n  padding:7rem 5rem 5rem;\n  position:relative;overflow:hidden;\n  background:#AF9C82;\n}\n/* Subtle grain texture overlay like the logo */\n#hero::before{\n  content:'';position:absolute;inset:0;\n  background:radial-gradient(ellipse 90% 80% at 30% 50%, #c2aa8e 0%, #af9c82 40%, #9a8870 75%, #7a6858 100%);\n  pointer-events:none;\n}\n.hero-logo-pos{\n  position:relative;z-index:1;\n  display:flex;justify-content:center;align-items:center;\n  animation:fadeIn 1.6s ease both;\n}\n.hero-logo-img{\n  width:min(420px,90%);\n  height:auto;\n  /* Subtle adjustment to match background tone */\n  filter: grayscale(0.15) brightness(1.04) contrast(0.95) saturate(0.9);\n  /* Layered mask: main ellipse shows all content, right edge fades more */\n  -webkit-mask-image:\n    linear-gradient(to left, transparent 0%, black 30%),\n    radial-gradient(\n      ellipse 72% 70% at 48% 53%,\n      black 0%,\n      rgba(0,0,0,0.97) 35%,\n      rgba(0,0,0,0.65) 60%,\n      rgba(0,0,0,0.1) 80%,\n      transparent 92%\n    );\n  -webkit-mask-composite: source-in;\n  mask-image:\n    linear-gradient(to left, transparent 0%, black 30%),\n    radial-gradient(\n      ellipse 72% 70% at 48% 53%,\n      black 0%,\n      rgba(0,0,0,0.97) 35%,\n      rgba(0,0,0,0.65) 60%,\n      rgba(0,0,0,0.1) 80%,\n      transparent 92%\n    );\n  mask-composite: intersect;\n  mix-blend-mode: multiply;\n  opacity: 0.96;\n}\n.hero-bottom-fade{display:none}\n.hero-content{\n  position:relative;z-index:1;\n  text-align:left;\n  padding-left:3rem;\n  border-left:1.5px solid rgba(95,59,44,.2);\n  animation:fadeUp .9s .4s ease both;opacity:0;animation-fill-mode:forwards;\n}\n.hero-tagline{\n  font-family:'Cormorant Garamond',serif;font-weight:300;\n  font-size:clamp(1.8rem,3vw,2.8rem);line-height:1.25;\n  color:var(--maroon);margin-bottom:.9rem;\n}\n.hero-tagline em{color:var(--taupe-xdark);font-style:italic}\n.hero-sub{\n  font-size:.73rem;font-weight:300;letter-spacing:.28em;\n  text-transform:uppercase;color:var(--taupe-xdark);opacity:.85;margin-bottom:2.2rem;\n}\n.cd-row{display:flex;gap:1.5rem;justify-content:flex-start;margin-bottom:2.2rem;align-items:flex-start}\n.cd-sep{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--maroon);opacity:.4;line-height:1.2}\n.cd-num{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:300;color:var(--maroon);display:block;line-height:1}\n.cd-lbl{font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe-xdark);opacity:.8}\n.hero-cta{\n  display:inline-block;padding:.88rem 2.8rem;\n  background:var(--maroon);\n  border:1.5px solid var(--maroon);color:var(--cream);\n  font-size:.68rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;\n  text-decoration:none;transition:all .35s;\n}\n.hero-cta:hover{background:var(--maroon);border-color:var(--maroon);text-shadow:none}\n.scroll-hint{\n  position:absolute;bottom:1.8rem;left:50%;transform:translateX(-50%);\n  display:flex;flex-direction:column;align-items:center;gap:.5rem;\n  color:rgba(95,59,44,.45);font-size:.53rem;letter-spacing:.25em;text-transform:uppercase;\n  animation:fadeIn 2.5s 2s ease both;opacity:0;animation-fill-mode:forwards;\n}\n.scroll-line{width:1px;height:38px;background:linear-gradient(to bottom,rgba(95,59,44,.35),transparent);animation:scroll 2s infinite}\n\n/* ── SECTION COMMON ─────────────────────────────────────────────── */\n.sec-lbl{font-size:.63rem;letter-spacing:.4em;text-transform:uppercase;color:var(--maroon);margin-bottom:.85rem;font-weight:400}\n.sec-title{font-family:'Cormorant Garamond',serif;font-weight:300;line-height:1.2;color:var(--text-h);font-size:clamp(1.9rem,3.2vw,2.75rem);margin-bottom:1.4rem}\n.sec-title em{color:var(--taupe-dark);font-style:italic}\n.divider-line{width:40px;height:1.5px;background:var(--taupe);margin:0 0 2rem}\n.body-t{font-size:.87rem;font-weight:300;line-height:1.9;color:var(--text-b)}\n\n/* ── SOBRE ──────────────────────────────────────────────────────── */\n#sobre{\n  padding:7rem 4rem;background:#EAE0D3;\n  display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center;\n}\n.sobre-visual-wrap{\n  display:flex;flex-direction:column;gap:0;\n}\n.sobre-visual{\n  aspect-ratio:3/4;position:relative;overflow:hidden;\n  background:var(--bg-alt);\n}\n.sobre-img{\n  width:100%;height:100%;\n  object-fit:cover;\n  object-position:center;\n  display:block;\n}\n.sobre-quote{\n  background:#EAE0D3;\n  padding:2rem 2rem 2rem;\n  border-top:2px solid var(--taupe);\n  position:relative;\n}\n.sobre-quote::before{\n  content:'\"';\n  font-family:'Cormorant Garamond',serif;\n  font-size:5rem;\n  color:var(--taupe);\n  line-height:0;\n  position:absolute;\n  top:2.2rem;left:1.5rem;\n  opacity:.5;\n}\n.sobre-quote p{\n  font-family:'Cormorant Garamond',serif;\n  font-size:1.15rem;\n  font-weight:300;\n  line-height:1.65;\n  color:var(--text-h);\n  font-style:italic;\n  padding-left:1.8rem;\n}\n.sobre-quote p strong{\n  font-style:normal;\n  font-weight:500;\n  color:var(--maroon);\n}\n\n/* ── FEATURES ───────────────────────────────────────────────────── */\n#features{padding:7rem 4rem;background:var(--bg-alt);text-align:center}\n#features .sec-lbl,#features .sec-title{text-align:center}\n.f-intro{font-size:.84rem;color:var(--text-m);font-weight:300;margin-bottom:4rem}\n.f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;text-align:left}\n.f-card{\n  background:var(--bg-card);padding:2.6rem 2.2rem;\n  border:1px solid var(--border);\n  transition:transform .3s,box-shadow .3s,border-color .3s;\n  position:relative;overflow:hidden;\n}\n.f-card::after{\n  content:'';position:absolute;bottom:0;left:0;right:0;\n  height:3px;background:var(--taupe);\n  transform:scaleX(0);transform-origin:left;\n  transition:transform .4s ease;\n}\n.f-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(95,59,44,.1);border-color:var(--taupe)}\n.f-card:hover::after{transform:scaleX(1)}\n.f-icon{font-size:1.5rem;margin-bottom:1.2rem;display:block}\n.f-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--text-h);margin-bottom:.6rem}\n.f-desc{font-size:.77rem;font-weight:300;line-height:1.8;color:var(--text-m)}\n\n/* ── EQUIPO ─────────────────────────────────────────────────────── */\n#equipo{padding:7rem 4rem;background:var(--bg-page)}\n.eq-layout{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;margin-top:3rem}\n.eq-list{list-style:none}\n.eq-list li{\n  padding:1rem 0;font-size:.84rem;font-weight:300;color:var(--text-b);\n  display:flex;justify-content:space-between;align-items:center;\n  border-bottom:1px solid var(--border);\n}\n.eq-list li:last-child{border-bottom:none}\n.eq-list li span{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe-dark)}\n.eq-hl{\n  background:var(--bg-alt);padding:2.4rem;\n  border-left:3px solid var(--taupe);\n}\n.eq-hl h3{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:300;color:var(--text-h);margin-bottom:.9rem}\n.eq-hl p{font-size:.81rem;font-weight:300;line-height:1.9;color:var(--text-b);margin-bottom:1.1rem}\n.badges{display:flex;flex-wrap:wrap;gap:.4rem}\n.badge{\n  padding:.28rem .8rem;\n  border:1px solid var(--taupe);\n  font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe-dark);\n  background:transparent;\n}\n\n/* ── UBICACION ──────────────────────────────────────────────────── */\n#ubicacion{\n  padding:7rem 4rem;background:var(--bg-alt);\n  display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center;\n}\n.addr-item{display:flex;gap:1.3rem;margin-bottom:1.8rem;align-items:flex-start}\n.addr-icon{font-size:1.1rem;margin-top:.1rem;flex-shrink:0;color:var(--maroon)}\n.addr-text strong{display:block;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--maroon);margin-bottom:.3rem;font-weight:400}\n.addr-text p{font-size:.88rem;font-weight:300;color:var(--text-b);line-height:1.7}\n.map-box{aspect-ratio:1;overflow:hidden;border:1px solid var(--border)}\n.map-box iframe{width:100%;height:100%;border:none;filter:sepia(20%) contrast(1.05)}\n\n/* ── INSCRIPCION ─────────────────────────────────────────────────── */\n#inscripcion{padding:7rem 4rem;background:var(--taupe);text-align:center}\n#inscripcion .sec-lbl{color:var(--cream);opacity:.75}\n#inscripcion .sec-title{color:var(--cream)}\n#inscripcion .sec-title em{color:rgba(239,233,213,.75)}\n#inscripcion .body-t{color:rgba(239,233,213,.8);max-width:490px;margin:0 auto 3rem;text-align:center}\n.form-wrap{max-width:460px;margin:0 auto}\n.fg{margin-bottom:1.5rem;text-align:left}\n.fg label{display:block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,233,213,.7);margin-bottom:.4rem}\n.fg input{\n  width:100%;padding:.75rem 0;background:transparent;\n  border:none;border-bottom:1px solid rgba(239,233,213,.3);\n  color:var(--cream);font-family:'Jost',sans-serif;font-size:.87rem;font-weight:300;outline:none;\n  transition:border-color .3s;\n}\n.fg input::placeholder{color:rgba(239,233,213,.3)}\n.fg input:focus{border-bottom-color:var(--cream)}\n.form-btn{\n  margin-top:1rem;width:100%;padding:1.05rem;\n  background:var(--maroon);border:none;color:var(--cream);\n  font-family:'Jost',sans-serif;font-size:.7rem;font-weight:400;letter-spacing:.35em;text-transform:uppercase;\n  cursor:pointer;transition:background .3s;\n}\n.form-btn:hover{background:var(--maroon-lt)}\n.form-btn:disabled{opacity:.6;cursor:not-allowed}\n.form-note{margin-top:1.3rem;font-size:.6rem;color:rgba(239,233,213,.5);font-weight:300}\n.form-ok{display:none;padding:1.8rem;background:rgba(95,59,44,.35);border:1px solid rgba(239,233,213,.3)}\n.form-ok p{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:300;color:var(--cream)}\n.form-ok small{font-size:.72rem;color:rgba(239,233,213,.7);display:block;margin-top:.4rem}\n\n/* ── FOOTER ─────────────────────────────────────────────────────── */\nfooter{\n  background:var(--taupe-xdark);\n  padding:2.4rem 4rem;\n  display:flex;justify-content:space-between;align-items:center;\n}\n.ft-logo-link { display:flex; align-items:center; text-decoration:none; line-height:0; }\n.ft-logo-img {\n  height: 52px; width: auto;\n  mix-blend-mode: multiply;\n  -webkit-mask-image: radial-gradient(ellipse 82% 82% at 50% 50%, black 55%, transparent 85%);\n  mask-image: radial-gradient(ellipse 82% 82% at 50% 50%, black 55%, transparent 85%);\n  filter: contrast(1.02);\n}\n.ft-info{font-size:.68rem;font-weight:300;color:rgba(239,233,213,.55);letter-spacing:.07em;text-align:center}\n.ft-socia es abiertas.<\u002Fstrong><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <p class=\"sec-lbl reveal\">Sobre nosotros<\u002Fp>\n    <h2 class=\"sec-title reveal\">Un gimnasio pensado<br><em>para las personas<\u002Fem><\u002Fh2>\n    <div class=\"divider-line reveal\"><\u002Fdiv>\n    <p class=\"body-t reveal\">Brisa Gym nace en el corazón de Gran Alacant con una visión clara: crear un espacio donde el entrenamiento sea accesible, efectivo y placentero para todos.<\u002Fp>\n    <p class=\"body-t reveal\" style=\"margin-top:1.2rem\">Contaremos con tecnología de vanguardia — el circuito eGym Smart Strength —, espacios de recuperación, clases dirigidas y una zona de bienestar integral diseñada para que cada visita sea una experiencia completa.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ FEATURES ═════════════════════════════════════════════ -->\n<section id=\"features\">\n  <p class=\"sec-lbl reveal\">Lo que encontrarás<\u002Fp>\n  <h2 class=\"sec-title reveal\">Espacios diseñados<br>para <em>tu bienestar<\u002Fem><\u002Fh2>\n  <p class=\"f-intro reveal\">Cada zona pensada para ofrecerte la mejor experiencia.<\u002Fp>\n  <div class=\"f-grid\">\n    <div class=\"f-card reveal\"><span class=\"f-icon\">⚡<\u002Fspan><h3 class=\"f-name\">Circuito eGym<\u002Fh3><p class=\"f-desc\">Smart Strength con máquinas inteligentes. IA adaptativa, seguimiento de progresos y ajuste automático de resistencia en cada sesión.<\u002Fp><\u002Fdiv>\n    <div class=\"f-card reveal\"><span class=\"f-icon\">💪<\u002Fspan><h3 class=\"f-name\">Musculación<\u002Fh3><p class=\"f-desc\">Equipamiento completo: mancuernas, barras, máquinas de cable, cintas de correr y bicicletas. Todo en un solo espacio.<\u002Fp><\u002Fdiv>\n    <div class=\"f-card reveal\"><span class=\"f-icon\">🧘<\u002Fspan><h3 class=\"f-name\">Clases Dirigidas<\u002Fh3><p class=\"f-desc\">Clases de GAP, Sppining, BrisaPump,&nbsp;jiu-jitsu brasileño, entrenamiento funcional, Zumba... Horarios flexibles pensados para tu día a día.<\u002Fp><\u002Fdiv>\n    <div class=\"f-card reveal\"><span class=\"f-icon\">✨<\u002Fspan><h3 class=\"f-name\">Recovery &amp; Wellness<\u002Fh3><p class=\"f-desc\">Zona de recuperación activa. El descanso inteligente también forma parte del entrenamiento.\nSauna con infrarrojos, bañera de hielo y hidromasaje\n\n<\u002Fp><\u002Fdiv>\n    <div class=\"f-card reveal\"><span class=\"f-icon\">🌿<\u002Fspan><h3 class=\"f-name\">Estética<\u002Fh3><p class=\"f-desc\">Cabinas de estética integradas para cuidar tu cuerpo por dentro y por fuera.<\u002Fp><\u002Fdiv>\n    <div class=\"f-card reveal\"><span class=\"f-icon\">☕<\u002Fspan><h3 class=\"f-name\">Cafetería<\u002Fh3><p class=\"f-desc\">Batidos proteicos, Açaí, snacks saludables y bebidas para reponer energía cuando más lo necesites.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ EQUIPAMIENTO ══════════════════════════════════════════ -->\n<section id=\"equipo\">\n  <p class=\"sec-lbl reveal\">Equipamiento<\u002Fp>\n  <h2 class=\"sec-title reveal\">Tecnología al servicio<br>de tu <em>rendimiento<\u002Fem><\u002Fh2>\n  <div class=\"eq-layout\">\n    <ul class=\"eq-list reveal\">\n      <li>Circuito eGym Smart Strength <span>MAQUINAS CON IA<\u002Fspan><\u002Fli>\n      <li style=\"border-color: rgba(74, 54, 38, 0.016)\">Café Gym <span>\n<\u002Fspan><\u002Fli>\n      <li>Bicicletas estáticas y elípticas <span>Alta gama<\u002Fspan><\u002Fli>\n      <li>Zona de peso libre completa <span>Mancuernas &amp; barras<\u002Fspan><\u002Fli>\n      <li style=\"border-color: rgba(74, 54, 38, 0)\"> <span>\n<\u002Fspan><\u002Fli>\n      <li>Zona de estiramiento y movilidad <span>Recovery<\u002Fspan><\u002Fli>\n      <li style=\"border-color: rgba(74, 54, 38, 0.027)\"> <span>\n<\u002Fspan><\u002Fli>\n      <li> <span>&nbsp;<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div class=\"eq-hl reveal\">\n      <h3>eGym Smart Strength<\u002Fh3>\n      <p>El sistema más avanzado del mercado. Cada máquina mide tu fuerza, ajusta la resistencia y registra tu progreso. Entrena de forma más inteligente, no más dura.<\u002Fp>\n      <p>Compatible con la app eGym para seguimiento completo de tus entrenamientos desde el móvil.<\u002Fp>\n      <div class=\"badges\">\n        <span class=\"badge\">Smart Strength<\u002Fspan>\n        <span class=\"badge\">Connected App<\u002Fspan>\n        <span class=\"badge\">IA Adaptativa<\u002Fspan>\n        <span class=\"badge\">Progress Tracking<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ UBICACION ════════════════════════════════════════════ -->\n<section id=\"ubicacion\">\n  <div>\n    <p class=\"sec-lbl reveal\">Dónde estamos<\u002Fp>\n    <h2 class=\"sec-title reveal\">En el corazón de<br><em>Gran Alacant<\u002Fem><\u002Fh2>\n    <div class=\"addr-item reveal\">\n      <div class=\"addr-icon\">📍<\u002Fdiv>\n      <div class=\"addr-text\"><strong>Dirección<\u002Fstrong><p>Av. Escandinavia, 72<br>Gran Alacant, Alicante, España<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"addr-item reveal\">\n      <div class=\"addr-icon\">📅<\u002Fdiv>\n      <div class=\"addr-text\"><strong>Apertura prevista<\u002Fstrong><p>Julio 2026<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"addr-item reveal\">\n      <div class=\"addr-icon\">✉️<\u002Fdiv>\n      <div class=\"addr-text\"><strong>Contacto<\u002Fstrong><p>brisagym.alc@gmail.com<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"map-box reveal\">\n    <iframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3150!2d-0.572!3d38.178!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzjCsDEwJzQwLjgiTiAwwrAzNCcxOS4yIlc!5e0!3m2!1ses!2ses!4v1\" allowfullscreen=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\" title=\"Brisa Gym\"><\u002Fiframe>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ══ PRE-INSCRIPCION ══════════════════════════════════════ -->\n<section id=\"inscripcion\">\n  <p class=\"sec-lbl reveal\">Ún tElementById('fBtn');b.disabled=true;b.textContent='Enviando...';\n  try{await fetch(this.action,{method:'POST',body:new FormData(this),headers:{Accept:'application/json'}})}catch(x){}\n  this.style.display='none';document.getElementById('formOk').style.display='block';\n});\n\n// Chat\nvar chatOpen=false, hist=[];\nvar SYS='Eres la asistente virtual de Brisa Gym, un gimnasio premium en Gran Alacant (Alicante, España).\\nApertura: julio 2026\\nDirección: Av. Escandinavia 72, Gran Alacant\\nServicios: Circuito eGym Smart Strength (12 máquinas), musculación, clases (yoga/pilates/spinning/HIIT), Recovery & Wellness, estética, cafetería\\nContacto: brisagym.alc@gmail.com\\nPre-inscripción disponible — condiciones especiales de lanzamiento\\nResponde en español, amable y conciso (máx 2-3 frases). Precios: \"Se anunciarán próximos a la apertura\".';\n\ndocument.getElementById('chat-btn').addEventListener('click',function(){\n  chatOpen=!chatOpen;\n  document.getElementById('chat-panel').style.display=chatOpen?'flex':'none';\n  document.getElementById('bicon').textContent=chatOpen?'✕':'💬';\n  if(chatOpen)setTimeout(function(){document.getElementById('ci').focus()},100);\n});\ndocument.getElementById('ci').addEventListener('input',function(){\n  document.getElementById('cs').disabled=!this.value.trim();\n});\ndocument.getElementById('ci').addEventListener('keydown',function(e){\n  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}\n});\nfunction qask(q){document.getElementById('ci').value=q;document.getElementById('quick').style.display='none';sendChat();}\nasync function sendChat(){\n  var inp=document.getElementById('ci'),txt=inp.value.trim();if(!txt)return;\n  addMsg('user',txt);inp.value='';document.getElementById('cs').disabled=true;\n  hist.push({role:'user',content:txt});\n  var t=addTyping(),reply;\n  try{\n    var r=await fetch('https://api.anthropic.com/v1/messages',{\n      method:'POST',headers:{'Content-Type':'application/json'},\n      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,system:SYS,messages:hist})\n    });\n    var d=await r.json();\n    reply=(d.content&&d.content[0]&&d.content[0].text)?d.content[0].text:'No pude procesar. Inténtalo de nuevo.';\n  }catch(err){reply='Error de conexión. Por favor, inténtalo de nuevo.';}\n  rmTyping(t);hist.push({role:'assistant',content:reply});addMsg('assistant',reply);\n}\nfunction addMsg(r,t){\n  var c=document.getElementById('msgs'),w=document.createElement('div');w.className='mw '+r;\n  var b=document.createElement('div');b.className='mb';b.textContent=t;w.appendChild(b);c.appendChild(w);c.scrollTop=c.scrollHeight;\n}\nfunction addTyping(){\n  var c=document.getElementById('msgs'),w=document.createElement('div');w.className='typing-wrap';\n  w.innerHTML='<div class=\"typing\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>';\n  c.appendChild(w);c.scrollTop=c.scrollHeight;return w;\n}\nfunction rmTyping(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
